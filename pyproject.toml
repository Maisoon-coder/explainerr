[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explainerr"
version = "0.1.0"
description = "用中文解释 CLI 报错，并给出可检查的下一步。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
explainerr = "explainerr.cli:main"

[tool.setuptools.packages.find]
include = ["explainerr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
